[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ite-agent"
version = "0.2.7"
description = "Your AI coding agent for your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agent", "terminal", "cli", "llm"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]
dependencies = ["click", "rich", "openai", "pydantic", "tiktoken", "html2text", "beautifulsoup4", "PyYAML", "pypdf", "pdf-inspector", "firecrawl-anydoc", "Pillow", "pytesseract", "ddgs", "tomli", "platformdirs", "fastmcp", "lxml", "textual[syntax]>=8.2.0", "certifi", "cryptography>=46.0.0", "python-telegram-bot[job-queue]>=21.0", "telegramify-markdown>=1.2.0"]

[project.scripts]
ite = "ite.main:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "ruff", "mypy", "pytest"]

[[project.authors]]
name = "Kiishi David"

[tool]

[tool.hatch]

[tool.hatch.build]

[tool.hatch.build.targets]

[tool.hatch.build.targets.wheel]
packages = ["src/ite"]
