<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="hud">
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
                <div id="ammo-display">
                    <span id="ammo-count">20</span>
                    <span id="weapon-name">Pistol</span>
                </div>
                <div id="score-display">Score: <span id="score">0</span></div>
                <div id="wave-display">Wave: <span id="wave">1</span></div>
            </div>
            <div id="main-menu" class="menu">
                <h1>Top-Down Shooter</h1>
                <p>WASD to move | Mouse to aim & shoot</p>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="pause-menu" class="menu hidden">
                <h2>Paused</h2>
                <button id="resume-btn">Resume</button>
                <button id="restart-btn">Restart</button>
            </div>
            <div id="game-over-menu" class="menu hidden">
                <h2>Game Over</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn-2">Play Again</button>
            </div>
        </div>
    </div>
    <script src="js/main.js" type="module"></script>
</body>
</html>
