<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>SNAKE</h1>
        <div class="score-board">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
        </div>
        <div class="top-bar">
            <div class="speed-indicator">Speed: <span id="speedLevel">1</span></div>
            <button id="pauseBtn" class="icon-btn">⏸</button>
        </div>
        <canvas id="game" width="400" height="400"></canvas>
        <div class="controls">
            <p>Use Arrow Keys or WASD to move</p>
            <p class="hint">Press SPACE or P to pause</p>
            <button id="startBtn">Start Game</button>
        </div>
        <div class="mobile-controls">
            <button id="upBtn" class="dpad-btn">▲</button>
            <div class="dpad-row">
                <button id="leftBtn" class="dpad-btn">◀</button>
                <button id="downBtn" class="dpad-btn">▼</button>
                <button id="rightBtn" class="dpad-btn">▶</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
