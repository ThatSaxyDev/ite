[mcp_servers.vercel]
enabled = true
url = "https://mcp.vercel.com"
auth = "oauth"
oauth_client_name = "iTE MCP Client"
oauth_callback_port = 3333

# [mcp_servers.netlify]
# enabled = true
# command = "npx"
# args = ["-y", "@netlify/mcp"]
# startup_timeout_sec = 45
# env = { NETLIFY_PERSONAL_ACCESS_TOKEN = "${NETLIFY_PERSONAL_ACCESS_TOKEN}" }

[mcp_servers.chrome]
enabled = true
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
    "--autoConnect",
]
startup_timeout_sec = 45

[mcp_servers.ios-simulator]
enabled = true
command = "npx"
args = ["-y", "ios-simulator-mcp"]
startup_timeout_sec = 90

[mcp_servers.aivara]
enabled = true
auto_connect = false
startup_timeout_sec = 45
context_resolution = { patientId = ["ListPatients", "SearchPatients"], documentId = ["GetDocuments"], encounterId = ["GetEncounters"] }
url = "https://aivara-tools.up.railway.app/mcp"
transport = "streamable_http"

[mcp_servers.aivara.headers]
"Content-Type" = "application/json"
"Accept" = "application/json, text/event-stream"
"x-fhir-server-url" = "https://app.promptopinion.ai/api/workspaces/019ce299-a68e-79ce-a4ae-2bd8b4d5a683/fhir"
"X-Aivara-Key" = "${AIVARA_MCP_KEY}"

[mcp_servers.paper]
enabled = true
auto_connect = false
startup_timeout_sec = 45
url = "http://127.0.0.1:29979/mcp"

