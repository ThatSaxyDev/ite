name: Build iTE Runtime

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: from pyproject.toml)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Matrix build across all 4 platforms ──────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            archive_ext: tar.gz
          - target: darwin-x64
            os: macos-14
            archive_ext: tar.gz
          - target: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: win32-x64
            os: windows-latest
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build runtime
        run: |
          VERSION='${{ github.event.inputs.version }}'
          if [ -n "$VERSION" ]; then
            python scripts/build_runtime.py --target ${{ matrix.target }} --version "$VERSION"
          else
            python scripts/build_runtime.py --target ${{ matrix.target }}
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/runtime/${{ matrix.target }}/ite-*.${{ matrix.archive_ext }}
            dist/runtime/${{ matrix.target }}/ite-*.${{ matrix.archive_ext }}.sha256
          retention-days: 7

      - name: Report
        run: |
          echo "Built ${{ matrix.target }}"
          ls -lh dist/runtime/${{ matrix.target }}/ite-*.${{ matrix.archive_ext }}*

  # ── Create GitHub Release + deploy manifest ──────────────────
  release:
    if: github.ref == 'refs/heads/development'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Restructure artifacts for manifest
        run: |
          mkdir -p dist/runtime
          for target_dir in artifacts/*/; do
            target=$(basename "$target_dir")
            mkdir -p "dist/runtime/${target}"
            cp -v "${target_dir}"/* "dist/runtime/${target}/"
          done
          echo "Artifacts restructured:"
          find dist/runtime -type f | sort

      - name: Generate manifest
        run: |
          pip install tomli 2>/dev/null || true
          python scripts/build_runtime.py --manifest-only

      - name: Get version
        id: get_version
        run: |
          pip install tomli 2>/dev/null || true
          VERSION=$(python scripts/build_runtime.py --print-version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: v$VERSION"

      - name: Create GitHub Release (ite-releases)
        env:
          GH_TOKEN: ${{ secrets.ITE_RELEASES_PAT }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="v${VERSION}"
          echo "Creating release $TAG on ThatSaxyDev/ite-releases..."

          ARTIFACTS=()
          for dir in artifacts/*/; do
            for f in "$dir"*; do
              [ -f "$f" ] && ARTIFACTS+=("$f")
            done
          done

          echo "Uploading ${#ARTIFACTS[@]} files..."
          gh release create "$TAG" \
            --repo ThatSaxyDev/ite-releases \
            --title "$TAG" \
            --notes "iTE ${TAG} — standalone runtime

          ### One-command install

          \`\`\`bash
          curl -fsSL https://ite.kiishi.space/install.sh | sh
          \`\`\`

          ### Artifacts

          Built with PyInstaller. Includes bundled Python + all dependencies.
          " \
            "${ARTIFACTS[@]}"

          echo "Release created: https://github.com/ThatSaxyDev/ite-releases/releases/tag/$TAG"

      - name: Deploy manifest to cloud-web
        env:
          GH_TOKEN: ${{ secrets.ITE_CLOUD_WEB_PAT }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Deploying manifest v${VERSION} to ite-cloud-web..."

          git clone --depth 1 --branch bach_write "https://x-access-token:${GH_TOKEN}@github.com/ThatSaxyDev/ite-cloud-web.git" /tmp/cloud-web

          mkdir -p /tmp/cloud-web/public/releases
          cp dist/manifest.json /tmp/cloud-web/public/releases/manifest.json

          cd /tmp/cloud-web
          git config user.name "ite-ci"
          git config user.email "ci@ite.kiishi.space"
          git add public/releases/manifest.json
          git commit -m "release: v${VERSION} manifest" || echo "No changes to commit"
          git push origin HEAD:bach_write

          echo "Manifest deployed. Live at: https://ite.kiishi.space/releases/manifest.json"
