<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
    }
    h1 {
      color: #0f0;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
      margin-bottom: 20px;
      font-size: 2.5rem;
      letter-spacing: 4px;
    }
    #gameCanvas {
      border: 2px solid #0f0;
      box-shadow: 0 0 20px #0f0, inset 0 0 20px rgba(0, 255, 0, 0.1);
    }
    #score {
      color: #0f0;
      font-size: 1.5rem;
      margin-top: 20px;
      text-shadow: 0 0 10px #0f0;
    }
    #instructions {
      color: #666;
      margin-top: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="score">Score: 0</div>
  <div id="instructions">Arrow Keys to Move • Space to Restart</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let gameOver = false;
    let gameLoop = null;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      gameOver = false;
      spawnFood();
      updateScore();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 1000 / 15);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver = true;
      }

      if (!gameOver && snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver = true;
      }

      if (gameOver) {
        clearInterval(gameLoop);
        draw();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.shadowColor = '#0f0';
      ctx.shadowBlur = 10;
      snake.forEach((seg, i) => {
        ctx.globalAlpha = i === 0 ? 1 : 0.7;
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#f0f';
      ctx.shadowColor = '#f0f';
      ctx.shadowBlur = 15;
      ctx.fillRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4);
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f00';
        ctx.font = '30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Courier New';
        ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function updateScore() {
      scoreEl.textContent = `Score: ${score}`;
    }

    document.addEventListener('keydown', e => {
      if (gameOver && e.code === 'Space') {
        init();
        return;
      }

      switch (e.key) {
        case 'ArrowUp':
          if (dy !== 1) { nextDx = 0; nextDy = -1; }
          break;
        case 'ArrowDown':
          if (dy !== -1) { nextDx = 0; nextDy = 1; }
          break;
        case 'ArrowLeft':
          if (dx !== 1) { nextDx = -1; nextDy = 0; }
          break;
        case 'ArrowRight':
          if (dx !== -1) { nextDx = 1; nextDy = 0; }
          break;
      }
    });

    init();
  </script>
</body>
</html>
