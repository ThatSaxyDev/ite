<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - 3D Retro Arcade</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-overlay">
        <h1 class="game-title">TIC TAC TOE</h1>
        
        <div class="status-bar">
            <span id="status-text">Player X's Turn</span>
            <span id="current-mode">2-Player Mode</span>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>Mode:</label>
                <select id="mode-select">
                    <option value="pvp">2 Players</option>
                    <option value="pve">vs AI</option>
                </select>
            </div>
            
            <div class="control-group" id="difficulty-group" style="display: none;">
                <label>Difficulty:</label>
                <select id="difficulty-select">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            
            <button id="reset-btn" class="retro-btn">NEW GAME</button>
        </div>
        
        <div id="winner-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-text">PLAYER X WINS!</h2>
                <button id="play-again-btn" class="retro-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="js/game.js"></script>
    <script>
        // Verify ThreeJS loaded
        console.log('ThreeJS loaded:', typeof THREE !== 'undefined');
    </script>
</body>
</html>
